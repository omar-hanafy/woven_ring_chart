name: pub-dry-run

# main carries stable versions and dev carries prereleases. The archive is
# validated on both lanes and on every pull request that targets them, so a
# version is never tagged before its archive is known to be publishable.
on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

defaults:
  run:
    working-directory: "."

jobs:
  dry-run:
    name: dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      - run: dart pub publish --dry-run
