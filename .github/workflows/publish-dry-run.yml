name: pub-dry-run

# main carries stable versions and dev carries prereleases. The archive is
# validated on both lanes and on every pull request that targets them, so a
# version is never tagged before its archive is known to be publishable.
on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

defaults:
  run:
    working-directory: "."

jobs:
  dry-run:
    name: dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart pub publish --dry-run
