name: Publish to pub.dev

on:
  push:
    tags:
      - 'woven_ring_chart-v*'

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    # zizmor: ignore[unpinned-uses] -- Canonical Dart Trusted Publisher workflow follows its supported v1 contract.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: "."

