name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test-stable:
    name: Test on stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - name: Set up Java for the Android example
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate release lane and changelog
        env:
          TARGET_LANE: ${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}
        run: python3 tool/release_guard.py --lane "$TARGET_LANE"
      - name: Validate package and example
        run: bash tool/validate_all.sh
      - name: Build the web showcase
        working-directory: example
        run: flutter build web --release --target lib/showcase.dart
      - name: Build the Android showcase
        working-directory: example
        run: flutter build apk --release --target lib/showcase.dart

  test-compatibility:
    name: Test ${{ matrix.configuration }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - configuration: minimum Flutter
            flutter-version: '3.47.7'
            dependencies: get
          - configuration: lower dependencies
            flutter-version: ''
            dependencies: downgrade
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter-version }}
      - name: Resolve dependency bounds
        env:
          DEPENDENCY_COMMAND: ${{ matrix.dependencies }}
        run: |
          flutter pub "$DEPENDENCY_COMMAND"
          cd example
          flutter pub "$DEPENDENCY_COMMAND"
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Verify example
        working-directory: example
        run: |
          flutter analyze
          flutter test --reporter expanded

  test-beta:
    name: Test on beta
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: beta
      - run: flutter pub get
      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  example-macos:
    name: Example on macOS and iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - name: Generate the current macOS runner
        shell: bash
        run: |
          set -euo pipefail
          scaffold=$(mktemp -d)
          trap 'rm -rf "$scaffold"' EXIT
          flutter create --no-pub --platforms=macos \
            --project-name woven_ring_chart_example --org com.omarhanafy "$scaffold"
          cp -R "$scaffold/macos" example/macos
      - name: Test the native showcase
        working-directory: example
        run: |
          flutter pub get
          flutter test integration_test/showcase_flow_test.dart -d macos
      - name: Build the iOS showcase
        working-directory: example
        run: flutter build ios --release --no-codesign --target lib/showcase.dart

  pana:
    name: Pana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
      - run: flutter pub get
      # Pana validates the declared screenshot using these executables.
      - name: Install webp tools
        run: sudo apt-get update && sudo apt-get install -y webp
      - run: dart pub global activate pana 0.23.19
      - run: pana --exit-code-threshold 0 .
