name: Auto release

on:
  push:
    branches:
      - main
      - dev

permissions:
  contents: write
  actions: read

concurrency:
  group: auto-release-${{ github.repository }}-woven_ring_chart-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # zizmor: ignore[artipacked] -- PAT credentials are required by git push below; this job uploads no artifacts.
          persist-credentials: true
          fetch-depth: 0
          # Falls back so the job can run and report; the guard below stops
          # it before it can tag with an identity that cannot publish.
          token: ${{ secrets.TAG_PUSH_PAT || github.token }}

      - name: Compare package versions
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          python3 tool/release_guard.py \
            --lane "$GITHUB_REF_NAME" \
            --before "$BEFORE_SHA" \
            --github-output "$GITHUB_OUTPUT" \
            --notes-path "$RUNNER_TEMP/woven_ring_chart-release-notes.md"

      - name: Require a tag-push identity
        if: steps.version.outputs.changed == 'true'
        env:
          TAG_PUSH_PAT: ${{ secrets.TAG_PUSH_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAG_PUSH_PAT:-}" ]]; then
            echo 'TAG_PUSH_PAT is not set.'
            echo
            echo 'A tag pushed with GITHUB_TOKEN does not start another workflow, so'
            echo 'publish.yml would never run and the version would be spent on a tag'
            echo 'that never published. Stopping before the tag is created.'
            echo
            echo 'Add a fine-grained PAT limited to this repository with Contents'
            echo 'read and write, stored as the TAG_PUSH_PAT secret.'
            exit 1
          fi

      - name: Wait for checks on this exact merged commit
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tool/wait_release_checks.py \
            --repo "$GITHUB_REPOSITORY" \
            --branch "$GITHUB_REF_NAME" \
            --sha "$GITHUB_SHA"

      - name: Verify tag is new
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          git fetch --force --tags origin
          if git show-ref --verify --quiet "refs/tags/$tag" || \
              git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists. Never move or reuse a release tag."
            exit 1
          fi

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          args=("$tag" --verify-tag --title "$tag" \
            --notes-file "$RUNNER_TEMP/woven_ring_chart-release-notes.md" \
            --target "$GITHUB_SHA")
          if [[ "${GITHUB_REF_NAME}" == 'dev' ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
