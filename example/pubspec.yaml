name: woven_ring_chart_example
description: >
  The woven_ring_chart showcase: one page pairing every live chart with the
  Dart that produced it.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  # Only so the showcase's pub.dev and GitHub links open. The package itself
  # has no dependencies beyond Flutter.
  url_launcher: ^6.3.1
  woven_ring_chart:
    path: ../

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
