<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Replaced by the value of the `--base-href` argument passed to
    `flutter build web`. The Pages workflow derives it from the repository so a
    rename cannot leave the deployed page loading its assets from nowhere.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Live demo of woven_ring_chart, a doughnut chart for Flutter whose segments lap over one another like shingles.">
  <meta name="theme-color" content="#FBFAF7">

  <!-- Link previews, for when the demo URL is pasted somewhere. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="woven_ring_chart">
  <meta property="og:description" content="A doughnut chart for Flutter whose segments lap over one another like shingles. Every boundary between two colours is a true semicircle.">
  <meta property="og:image" content="https://raw.githubusercontent.com/omar-hanafy/woven_ring_chart/5ca191d40a7fdd0517f0bfb59e8ebe8cfd09d220/screenshots/woven_ring_chart.png">
  <meta property="og:url" content="https://omar-hanafy.github.io/woven_ring_chart/">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="woven_ring_chart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>woven_ring_chart</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* The page paints this before Flutter has anything to show, so the first
       frame is the demo's own paper colour instead of a white flash. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #FBFAF7;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
